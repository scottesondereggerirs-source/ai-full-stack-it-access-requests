[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-it-access"
version = "0.1.0"
description = "Source-grounded access-request intake and human review queue"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
it-access = "it_access.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
it_access = ["extraction_prompt.txt"]
